# Template. deploy/setup-vps.sh replaces __DOMAIN__ and installs this to
# /etc/nginx/sites-available/leela, so the real domain never has to be edited by hand.
#
# HTTP only on purpose: `certbot --nginx` adds the 443 server block, the
# certificate and the redirect for us.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Banners, galleries and review photos reach the API as base64 JSON and the
    # backend allows 10mb bodies; nginx would reject anything over its 1m default.
    client_max_body_size 15m;

    access_log /var/log/nginx/leela.access.log;
    error_log /var/log/nginx/leela.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:5000;

        # The API runs behind this proxy, so it needs the visitor's real IP for
        # rate limiting (server.js sets "trust proxy") and correct redirect URLs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
